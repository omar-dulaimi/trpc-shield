name: Semantic Release

on:
  push:
    branches: [ master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required for npm Trusted Publishing: @semantic-release/npm requests a GitHub OIDC token and
      # exchanges it with the registry for a short-lived credential.
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Trusted publishing needs npm >= 11.5.1, which ships with Node 24. Node 22 carries npm 10
        # and cannot perform the OIDC exchange.
        node-version: '24.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build and test
      run: |
        pnpm build
        pnpm typecheck
        pnpm lint
        pnpm test:coverage

    # The unit tests import from src/, so they pass regardless of what the tarball contains. Every
    # release from 1.0.0 to 2.0.1 was unloadable and this gate is what would have caught it, so it
    # runs before anything is published rather than after.
    - name: Test the published package
      run: pnpm test:package

    # Named lib.zip to match the asset path in .releaserc.json. The build writes to lib/, so the
    # previous dist.zip reference attached nothing to the GitHub release.
    - name: Create distribution zip
      run: zip -r lib.zip lib/

    - name: Semantic Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No NPM_TOKEN: auth is the OIDC exchange. Setting one would write a conflicting .npmrc.
      run: pnpm exec semantic-release